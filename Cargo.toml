[package]
name = "pstart-rs"
version = "0.8.1"
edition = "2021"
description = "Lanceur portable pour clé USB, compatible avec les fichiers PStart.xml"
license = "MIT"
repository = "https://github.com/imtheyoyo/pstart-rs"
readme = "README.md"

[dependencies]
eframe = "0.37"
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26"
global-hotkey = "0.9"
raw-window-handle = "0.6"
rfd = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
# TLS du système (Schannel sous Windows) : exécutable plus léger qu'avec rustls.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
# Optimisation pour la taille : l'interface reste fluide.
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
strip = true
