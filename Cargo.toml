[package]
name = "pstart-rs"
version = "0.6.0"
edition = "2021"
description = "Lanceur portable pour clé USB, compatible avec les fichiers PStart.xml"
license = "MIT"
repository = "https://github.com/imtheyoyo/pstart-rs"
readme = "README.md"

[dependencies]
eframe = "0.37"
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26"
global-hotkey = "0.9"
raw-window-handle = "0.6"
rfd = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
