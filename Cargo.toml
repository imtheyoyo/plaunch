[package]
name = "pstart-rs"
version = "0.1.0"
edition = "2021"
description = "Lanceur portable pour clé USB, compatible avec les fichiers PStart.xml"
license = "MIT"
repository = "https://github.com/imtheyoyo/pstart-rs"
readme = "README.md"

[dependencies]
eframe = "0.37"
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
