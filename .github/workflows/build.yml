name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        shell: pwsh
        run: |
          # Les diagnostics sont aussi publiés en annotations, lisibles sans ouvrir le journal.
          $env:CARGO_TERM_COLOR = "never"
          $out = cargo clippy --locked --all-targets --message-format=short -- -D warnings 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Write-Output
          $out | Where-Object { $_ -match '(error|warning)' -and $_ -notmatch '^\s*(Compiling|Checking)' } |
            Select-Object -First 20 | ForEach-Object { Write-Output "::error::$_" }
          exit $code
      - name: Build release
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v5
        with:
          name: pstart-rs-windows-x64
          path: target/release/pstart-rs.exe
      # Publication automatique : à chaque nouvelle version dans Cargo.toml,
      # le premier build réussi sur main crée le tag vX.Y.Z et la release.
      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PStart-rs ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: target/release/pstart-rs.exe
