name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        shell: pwsh
        run: |
          # Les diagnostics sont aussi publiés en annotations, lisibles sans ouvrir le journal.
          $env:CARGO_TERM_COLOR = "never"
          $out = cargo clippy --locked --all-targets --message-format=short -- -D warnings 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Write-Output
          $out | Where-Object { $_ -match '(error|warning)' -and $_ -notmatch '^\s*(Compiling|Checking)' } |
            Select-Object -First 20 | ForEach-Object { Write-Output "::error::$_" }
          exit $code
      - name: Build release
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: pstart-rs-windows-x64
          path: target/release/pstart-rs.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/pstart-rs.exe
