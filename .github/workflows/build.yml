name: build

on:
  push:
    # Les branches feature/ sont compilées et testées, mais jamais publiées.
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        shell: pwsh
        run: |
          # Erreurs de compilation et tests en échec publiés en annotations.
          $env:CARGO_TERM_COLOR = "never"
          # Sans puis avec le serveur MCP (fonctionnalité « mcp »).
          $out = cargo test --locked --workspace 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $out += cargo test --locked --workspace --all-features 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
          }
          $out | Write-Output
          $out | Where-Object { $_ -match '^(error|warning)|panicked|FAILED|^\s+-->' } |
            Select-Object -First 30 | ForEach-Object { Write-Output "::error::$_" }
          exit $code
      - name: Clippy
        shell: pwsh
        run: |
          # Les diagnostics sont aussi publiés en annotations, lisibles sans ouvrir le journal.
          $env:CARGO_TERM_COLOR = "never"
          $out = cargo clippy --locked --workspace --all-targets --message-format=short -- -D warnings 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $out += cargo clippy --locked --workspace --all-targets --all-features --message-format=short -- -D warnings 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
          }
          $out | Write-Output
          $out | Where-Object { $_ -match '(error|warning)' -and $_ -notmatch '^\s*(Compiling|Checking)' } |
            Select-Object -First 20 | ForEach-Object { Write-Output "::error::$_" }
          exit $code
      - name: Build release
        run: cargo build --locked --release
      # Variante pilotable par une IA (serveur MCP, voir docs/MCP.md),
      # compilée à part pour que plaunch.exe reste inchangé.
      - name: Build release (MCP)
        shell: pwsh
        run: |
          cargo build --locked --release --features mcp --target-dir target-mcp
          Copy-Item target-mcp/release/plaunch.exe target/release/plaunch-mcp.exe
      # Empreinte vérifiée par la mise à jour intégrée avant installation.
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/plaunch.exe -Algorithm SHA256).Hash.ToLower()
          "$h  plaunch.exe" | Out-File -Encoding ascii -NoNewline target/release/plaunch.exe.sha256
          $m = (Get-FileHash target/release/plaunch-mcp.exe -Algorithm SHA256).Hash.ToLower()
          "$m  plaunch-mcp.exe" | Out-File -Encoding ascii -NoNewline target/release/plaunch-mcp.exe.sha256
          Get-Item target/release/plaunch.exe, target/release/plaunch-mcp.exe | Select-Object Name, Length
          Get-Content target/release/plaunch.exe.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: plaunch-windows-x64
          path: |
            target/release/plaunch.exe
            target/release/plaunch.exe.sha256
            target/release/plaunch-mcp.exe
            target/release/plaunch-mcp.exe.sha256
      # Publication automatique : à chaque nouvelle version dans Cargo.toml,
      # le premier build réussi sur main crée le tag vX.Y.Z et la release.
      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      # Texte de la release : section de CHANGELOG.md pour cette version.
      - name: Notes
        id: notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          python .github/scripts/release_notes.py notes
          $f = "notes/${{ steps.version.outputs.tag }}.md"
          if (-not (Test-Path $f)) { "Version publiée. Voir CHANGELOG.md." | Out-File -Encoding utf8 $f }
          "path=$f" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PLaunch ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            target/release/plaunch.exe
            target/release/plaunch.exe.sha256
            target/release/plaunch-mcp.exe
            target/release/plaunch-mcp.exe.sha256
