name: release-notes

# Recopie les sections de CHANGELOG.md dans les notes des releases.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md, .github/scripts/release_notes.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Notes par version
        run: python3 .github/scripts/release_notes.py notes
      - name: Mise à jour des releases existantes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in notes/*.md; do
            tag=$(basename "$f" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f" --title "PLaunch $tag"
              echo "notes mises à jour : $tag"
            else
              echo "pas encore de release : $tag"
            fi
          done
      # Anciens fichiers publiés : renommés avec le nom actuel.
      - name: Noms des fichiers des releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].assets[] | select(.name | startswith("pstart-rs")) | "\(.id) \(.name)"' |
          while read -r id name; do
            new="plaunch${name#pstart-rs}"
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" -f name="$new" --jq .name
          done
